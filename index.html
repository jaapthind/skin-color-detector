<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>SkinScan™ - Mobile Optimized</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #000;
            color: #fff;
            touch-action: none;
        }

        :root {
            --brand-blue: #4285F4;
            --brand-red: #EA4335;
            --brand-yellow: #FBBC05;
            --brand-green: #34A853;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-blur: blur(20px);
        }

        .ambient-layer {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            z-index: 1;
            background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-red) 33%, var(--brand-yellow) 66%, var(--brand-green) 100%);
            background-size: 400% 400%;
            animation: gradientDrift 15s ease infinite alternate;
        }

        @keyframes gradientDrift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .application-root {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .glass-chassis {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .interface-header {
            padding: 10px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
            flex-shrink: 0;
        }

        .interface-header h1 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 1px;
        }

        .interface-header p {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
        }

        .sensor-container {
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .sensor-mount {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 1 / 1;
            background: rgba(0,0,0,0.6);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #video-feed.active { opacity: 1; }

        #video-feed canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1);
            border-radius: 12px;
        }

        .boot-loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.8);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .boot-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner-ring {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spinFast 0.8s linear infinite;
        }

        @keyframes spinFast { to { transform: rotate(360deg); } }

        .loader-text {
            font-size: 11px;
            font-weight: 600;
        }

        .metrics-grid {
            flex-grow: 1;
            padding: 0 12px 6px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 8px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .metrics-grid::-webkit-scrollbar { width: 0; }

        .metric-card {
            flex: 1 1 calc(50% - 4px);
            max-width: calc(50% - 4px);
            min-width: 130px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2px;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .metric-value {
            font-size: 14px;
            font-weight: 800;
            background: rgba(0,0,0,0.25);
            padding: 1px 6px;
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
        }

        .metric-track {
            width: 100%;
            height: 5px;
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .tier-alpha { background: rgba(52, 168, 83, 0.2); border-color: var(--brand-green); }
        .tier-alpha .metric-fill { background: var(--brand-green); }
        .tier-alpha .metric-value { color: #81c784; }
        
        .tier-beta { border-color: var(--brand-yellow); }
        .tier-beta .metric-fill { background: var(--brand-yellow); }
        .tier-beta .metric-value { color: #ffd54f; }
        
        .tier-gamma { opacity: 0.7; }
        .tier-gamma .metric-fill { background: var(--brand-red); }

        .action-dock {
            padding: 10px 16px 24px;
            display: flex;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .ignite-btn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .ignite-btn:active { transform: scale(0.96); }
        .ignite-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .display-none { display: none !important; }

        .congrats-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .congrats-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .congrats-content {
            text-align: center;
            padding: 20px;
            max-width: 90vw;
        }

        .congrats-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .congrats-label {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            word-break: break-word;
        }

        .congrats-reset-btn {
            margin-top: 30px;
            padding: 10px 24px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <div class="congrats-overlay" id="overlay-congrats">
        <div class="congrats-content">
            <div class="congrats-title">CONGRATS, YOU ARE</div>
            <div class="congrats-label" id="congrats-class-name">???</div>
            <button class="congrats-reset-btn" id="btn-reset-overlay">Continue Scanning</button>
        </div>
    </div>

    <div class="application-root">
        <main class="glass-chassis">
            <header class="interface-header">
                <h1>SkinScan™</h1>
                <p>Live Mobile Detection</p>
            </header>

            <section class="sensor-container">
                <div class="sensor-mount" id="sensor-mount">
                    <div class="boot-loader" id="loader-ui">
                        <div class="spinner-ring"></div>
                        <span class="loader-text" id="loader-message">Ready</span>
                    </div>
                    <div id="video-feed"></div>
                </div>
            </section>

            <section class="metrics-grid" id="metrics-grid"></section>

            <section class="action-dock">
                <button class="ignite-btn" id="btn-start">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <span>Activate SkinScan™</span>
                </button>
            </section>
        </main>
    </div>

    <script>
        const AppConfig = {
            ModelEndpoint: "https://teachablemachine.withgoogle.com/models/DPuAl5UGa/",
            Resolution: 224, 
            TargetFPS: 30, 
            TriggerValue: 0.93, 
            WarmupFrames: 10
        };

        const AppState = {
            Model: null,
            Webcam: null,
            TotalClasses: 0,
            IsRunning: false,
            AnimationID: null,
            LastFrameTime: 0,
            OverlayActive: false,
            FrameCount: 0,
            UINodes: {} 
        };

        const DOM = {
            BtnStart: document.getElementById('btn-start'),
            LoaderUI: document.getElementById('loader-ui'),
            LoaderMsg: document.getElementById('loader-message'),
            VideoFeed: document.getElementById('video-feed'),
            SensorMount: document.getElementById('sensor-mount'),
            MetricsGrid: document.getElementById('metrics-grid'),
            OverlayCongrats: document.getElementById('overlay-congrats'),
            CongratsName: document.getElementById('congrats-class-name'),
            BtnResetOverlay: document.getElementById('btn-reset-overlay')
        };

        const StartSequence = async () => {
            if (AppState.IsRunning) return;
            
            try {
                DOM.BtnStart.disabled = true;
                DOM.LoaderUI.classList.remove('hidden');
                DOM.LoaderMsg.innerText = "Loading Model...";
                
                const urlModel = AppConfig.ModelEndpoint + "model.json";
                const urlMetadata = AppConfig.ModelEndpoint + "metadata.json";
                
                AppState.Model = await tmImage.load(urlModel, urlMetadata);
                AppState.TotalClasses = AppState.Model.getTotalClasses();
                const classLabels = AppState.Model.getClassLabels();
                
                DOM.LoaderMsg.innerText = "Camera Permit...";
                AppState.Webcam = new tmImage.Webcam(AppConfig.Resolution, AppConfig.Resolution, true);
                
                await AppState.Webcam.setup({ facingMode: "user" }); 
                
                DOM.LoaderMsg.innerText = "Starting...";
                await AppState.Webcam.play();
                
                DOM.VideoFeed.innerHTML = '';
                DOM.VideoFeed.appendChild(AppState.Webcam.canvas);
                
                BuildMetricCards(classLabels);
                
                DOM.LoaderUI.classList.add('hidden');
                DOM.VideoFeed.classList.add('active');
                DOM.BtnStart.classList.add('display-none');
                
                AppState.IsRunning = true;
                AppState.FrameCount = 0;
                AppState.AnimationID = window.requestAnimationFrame(InferenceLoop);

            } catch (err) {
                console.error(err);
                DOM.LoaderMsg.innerText = "Camera Error";
                DOM.BtnStart.disabled = false;
            }
        };

        const InferenceLoop = async (timestamp) => {
            if (!AppState.IsRunning) return;

            const elapsed = timestamp - AppState.LastFrameTime;
            const limit = 1000 / AppConfig.TargetFPS;

            if (elapsed > limit) {
                AppState.LastFrameTime = timestamp - (elapsed % limit);
                AppState.Webcam.update(); 
                
                if (!AppState.OverlayActive) {
                    await ProcessInference(); 
                }
            }
            
            AppState.AnimationID = window.requestAnimationFrame(InferenceLoop);
        };

        const ProcessInference = async () => {
            if (!AppState.Model || !AppState.Webcam) return;
            
            const predictions = await AppState.Model.predict(AppState.Webcam.canvas);
            
            if (AppState.FrameCount < AppConfig.WarmupFrames) {
                AppState.FrameCount++;
                return;
            }
            
            for (let i = 0; i < AppState.TotalClasses; i++) {
                const pred = predictions[i];
                const cleanID = SanitizeID(pred.className);
                const rawProb = pred.probability;
                const formattedPercent = (rawProb * 100).toFixed(1);
                
                if (rawProb >= AppConfig.TriggerValue && !AppState.OverlayActive && AppState.FrameCount >= AppConfig.WarmupFrames) {
                    Trigger100PercentEvent(pred.className);
                    return; 
                }
                
                const uiNode = AppState.UINodes[cleanID];
                if (!uiNode) continue;

                uiNode.ValueText.innerText = `${formattedPercent}%`;
                uiNode.FillBar.style.width = `${formattedPercent}%`;

                uiNode.Card.classList.remove('tier-alpha', 'tier-beta', 'tier-gamma');

                if (rawProb >= 0.80) {
                    uiNode.Card.classList.add('tier-alpha');
                } else if (rawProb >= 0.40) {
                    uiNode.Card.classList.add('tier-beta');
                } else {
                    uiNode.Card.classList.add('tier-gamma');
                }
            }
        };

        const Trigger100PercentEvent = (className) => {
            AppState.OverlayActive = true;
            DOM.CongratsName.innerText = className;
            DOM.OverlayCongrats.classList.add('show');
            GenerateConfetti();
        };

        DOM.BtnResetOverlay.addEventListener('click', () => {
            DOM.OverlayCongrats.classList.remove('show');
            AppState.FrameCount = 0;
            setTimeout(() => {
                AppState.OverlayActive = false;
            }, 800);
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        });

        const BuildMetricCards = (labels) => {
            DOM.MetricsGrid.innerHTML = '';
            AppState.UINodes = {};

            labels.forEach((label) => {
                const cleanID = SanitizeID(label);

                const card = document.createElement('div');
                card.className = 'metric-card';

                const header = document.createElement('div');
                header.className = 'metric-header';

                const labelSpan = document.createElement('span');
                labelSpan.className = 'metric-label';
                labelSpan.innerText = label;

                const valueSpan = document.createElement('span');
                valueSpan.className = 'metric-value';
                valueSpan.innerText = '0.0%';

                header.appendChild(labelSpan);
                header.appendChild(valueSpan);

                const track = document.createElement('div');
                track.className = 'metric-track';

                const fill = document.createElement('div');
                fill.className = 'metric-fill';

                track.appendChild(fill);
                card.appendChild(header);
                card.appendChild(track);
                DOM.MetricsGrid.appendChild(card);

                AppState.UINodes[cleanID] = {
                    Card: card,
                    ValueText: valueSpan,
                    FillBar: fill
                };
            });
        };

        const SanitizeID = (str) => {
            return str.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
        };
        
        const GenerateConfetti = () => {
            const colors = ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#FFFFFF'];
            for(let i = 0; i < 30; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '6px';
                conf.style.height = '6px';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.transition = `transform 2s ease-in, opacity 2s`;
                DOM.OverlayCongrats.appendChild(conf);
                
                void conf.offsetWidth;
                setTimeout(() => {
                    conf.style.opacity = 1;
                    conf.style.transform = `translateY(110vh) rotate(${Math.random() * 360}deg)`;
                }, 50);
            }
        };

        DOM.BtnStart.addEventListener('click', StartSequence);
    </script>
</body>
</html>
