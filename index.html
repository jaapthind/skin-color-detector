<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>AI Vision Classification</title>

    <!-- TensorFlow.js & Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        /* ==========================================================================
           1. CSS RESET
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* ==========================================================================
           2. DYNAMIC GOOGLE GRADIENT BACKGROUND
           ========================================================================== */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            background: linear-gradient(135deg, #4285F4 0%, #EA4335 33%, #FBBC05 66%, #34A853 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 2;
            mix-blend-mode: screen;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: #4285F4;
            top: -50px; left: -50px;
        }

        .orb-2 {
            width: 400px; height: 400px;
            background: #EA4335;
            bottom: -100px; right: -50px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* ==========================================================================
           3. MAIN LAYOUT
           ========================================================================== */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .glass-panel {
            width: 100%;
            max-width: 500px;
            min-height: 90vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 20px;
        }

        /* ==========================================================================
           4. HEADER
           ========================================================================== */
        .header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        /* ==========================================================================
           5. CAMERA VIEWPORT
           ========================================================================== */
        .camera-section {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .camera-wrapper {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #webcam-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #webcam-container.active {
            opacity: 1;
        }

        /* Forces canvas to fit container smoothly */
        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1);
            border-radius: 20px;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px #fff;
            opacity: 0;
            z-index: 5;
        }

        .camera-wrapper.active .scan-line {
            animation: scanAnim 3s linear infinite;
        }

        @keyframes scanAnim {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ==========================================================================
           6. RESULTS DASHBOARD
           ========================================================================== */
        .results-section {
            flex-grow: 1;
            padding: 10px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: visible; /* Ensure cards are never hidden */
        }

        .class-card {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .class-name {
            font-size: 16px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .class-score {
            font-size: 16px;
            font-weight: 800;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 5px;
            transition: width 0.1s linear, background-color 0.3s ease;
        }

        /* Highlight Colors */
        .card-high { background: rgba(52, 168, 83, 0.4); border-color: #34A853; }
        .card-high .progress-fill { background: #34A853; box-shadow: 0 0 10px #34A853; }
        
        .card-med { background: rgba(251, 188, 5, 0.3); border-color: #FBBC05; }
        .card-med .progress-fill { background: #FBBC05; box-shadow: 0 0 10px #FBBC05; }
        
        .card-low { background: rgba(234, 67, 53, 0.2); }
        .card-low .progress-fill { background: #EA4335; }

        /* ==========================================================================
           7. CONTROLS
           ========================================================================== */
        .controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-start {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:active { transform: scale(0.95); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        <div class="glass-panel">
            
            <div class="header">
                <h1>Neural Engine</h1>
                <p>Live Teachable Machine Classification</p>
            </div>

            <div class="camera-section">
                <div class="camera-wrapper" id="cam-wrapper">
                    <div class="loader hidden" id="loader">
                        <div class="spinner"></div>
                        <span id="loader-text">Loading Model...</span>
                    </div>
                    <div class="scan-line"></div>
                    <div id="webcam-container"></div>
                </div>
            </div>

            <!-- Dashboard where dynamic cards will be appended -->
            <div class="results-section" id="results-container">
                <!-- Javascript will inject cards here -->
            </div>

            <div class="controls">
                <button class="btn-start" id="start-btn">Start Camera & AI</button>
            </div>

        </div>
    </div>

    <script>
        /**
         * ------------------------------------------------------------------
         * CORE LOGIC: Teachable Machine Implementation
         * ------------------------------------------------------------------
         */
        const URL = "https://teachablemachine.withgoogle.com/models/DPuAl5UGa/";
        let model, webcam, maxPredictions;
        let isRunning = false;
        
        // Cache DOM elements
        const startBtn = document.getElementById("start-btn");
        const loader = document.getElementById("loader");
        const loaderText = document.getElementById("loader-text");
        const webcamContainer = document.getElementById("webcam-container");
        const resultsContainer = document.getElementById("results-container");
        const camWrapper = document.getElementById("cam-wrapper");

        // UI Store for fast updating
        const classElements = {};

        startBtn.addEventListener("click", init);

        async function init() {
            if (isRunning) return;
            startBtn.disabled = true;
            loader.classList.remove("hidden");
            
            try {
                // 1. Load Model
                loaderText.innerText = "Downloading Model...";
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 2. Setup Webcam
                loaderText.innerText = "Starting Camera...";
                const flip = true; 
                // Set fixed small resolution to guarantee high framerate and prevent crashing
                webcam = new tmImage.Webcam(224, 224, flip); 
                
                // Request camera explicitly
                await webcam.setup({ facingMode: "user" }); 
                
                loaderText.innerText = "Buffering Stream...";
                await webcam.play();

                // 3. Mount Canvas
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);
                
                // 4. Build UI Cards
                createCards(model.getClassLabels());

                // 5. Finalize Setup
                loader.classList.add("hidden");
                webcamContainer.classList.add("active");
                camWrapper.classList.add("active");
                startBtn.classList.add("hidden");
                isRunning = true;

                // 6. Start Loop
                window.requestAnimationFrame(loop);

            } catch (err) {
                console.error(err);
                loaderText.innerText = "Camera Error. Check Permissions.";
                startBtn.disabled = false;
                startBtn.innerText = "Retry";
            }
        }

        async function loop() {
            if (!isRunning) return;
            webcam.update(); // Update the webcam frame
            await predict(); // Wait for prediction
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model || !webcam) return;
            
            // Predict based on current frame
            const predictions = await model.predict(webcam.canvas);
            
            for (let i = 0; i < maxPredictions; i++) {
                const pred = predictions[i];
                const cleanName = pred.className.replace(/[^a-zA-Z0-9]/g, '');
                const ui = classElements[cleanName];
                
                if (!ui) continue;

                // Calculate percentage
                const prob = pred.probability;
                const percent = (prob * 100).toFixed(1);

                // Update text and bar
                ui.score.innerText = `${percent}%`;
                ui.fill.style.width = `${percent}%`;

                // Reset styling
                ui.card.className = "class-card";

                // Apply dynamic CSS based on confidence
                if (prob > 0.80) {
                    ui.card.classList.add("card-high");
                    ui.card.style.order = 1; // Move to top
                } else if (prob > 0.40) {
                    ui.card.classList.add("card-med");
                    ui.card.style.order = 2; // Move to middle
                } else {
                    ui.card.classList.add("card-low");
                    ui.card.style.order = 3; // Move to bottom
                }
            }
        }

        function createCards(labels) {
            resultsContainer.innerHTML = ""; // Clear existing
            
            labels.forEach((label) => {
                const cleanName = label.replace(/[^a-zA-Z0-9]/g, '');
                
                // Card Wrapper
                const card = document.createElement("div");
                card.className = "class-card";
                card.id = `card-${cleanName}`;

                // Header (Name + Score)
                const header = document.createElement("div");
                header.className = "class-header";
                
                const title = document.createElement("span");
                title.className = "class-name";
                title.innerText = label;

                const score = document.createElement("span");
                score.className = "class-score";
                score.innerText = "0.0%";

                header.appendChild(title);
                header.appendChild(score);

                // Progress Bar
                const track = document.createElement("div");
                track.className = "progress-bar";

                const fill = document.createElement("div");
                fill.className = "progress-fill";

                track.appendChild(fill);

                // Build full card
                card.appendChild(header);
                card.appendChild(track);

                // Mount to DOM
                resultsContainer.appendChild(card);

                // Store references for rapid updating in loop
                classElements[cleanName] = {
                    card: card,
                    score: score,
                    fill: fill
                };
            });
        }
    </script>
</body>
</html>
