<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4285F4">
    <title>Advanced iOS Liquid Glass AI Vision</title>

    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        /* ==========================================================================
           CSS RESET & BASE TYPOGRAPHY
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #000;
        }

        /* ==========================================================================
           GOOGLE GRADIENT BACKGROUND SYSTEM
           ========================================================================== */
        .google-gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            /* Google Colors: Blue, Red, Yellow, Green */
            background: linear-gradient(
                -45deg, 
                #4285F4, 
                #EA4335, 
                #FBBC05, 
                #34A853,
                #4285F4,
                #EA4335
            );
            background-size: 400% 400%;
            animation: googleGradientFlow 12s ease infinite;
        }

        @keyframes googleGradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient floating light orbs to enhance the liquid glass reflections */
        .light-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            z-index: 1;
            mix-blend-mode: screen;
            animation: orbFloat 25s infinite alternate ease-in-out;
        }

        .orb-blue {
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, #ffffff 0%, #4285F4 100%);
            top: -10%; left: -10%;
        }

        .orb-red {
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, #ffffff 0%, #EA4335 100%);
            bottom: -20%; right: -10%;
            animation-delay: -5s;
        }

        .orb-yellow {
            width: 40vw; height: 40vw;
            background: radial-gradient(circle, #ffffff 0%, #FBBC05 100%);
            top: 40%; left: 30%;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15vw, -10vh) scale(1.2); }
            66% { transform: translate(-10vw, 15vh) scale(0.8); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* ==========================================================================
           IOS LIQUID GLASSMORPHISM SYSTEM
           ========================================================================== */
        .app-wrapper {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            perspective: 1000px;
        }

        .liquid-glass-panel {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            
            /* Core Liquid Glass Properties */
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.25) 0%, 
                rgba(255, 255, 255, 0.05) 100%
            );
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            
            /* Highlight borders for 3D liquid edge effect */
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            
            border-radius: 40px;
            
            /* Complex shadowing for depth */
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        /* Inner light reflection simulating thick glass */
        .liquid-glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 120px;
            background: linear-gradient(
                to bottom, 
                rgba(255,255,255,0.3) 0%, 
                rgba(255,255,255,0) 100%
            );
            pointer-events: none;
            z-index: 15;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }

        /* ==========================================================================
           HEADER COMPONENT
           ========================================================================== */
        .header {
            padding: 30px 24px 20px;
            text-align: center;
            position: relative;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* ==========================================================================
           CAMERA VIEWPORT (Liquid UI)
           ========================================================================== */
        .viewport-section {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .camera-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 320px;
            
            /* Nested glass effect */
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            border-radius: 32px;
            border-top: 1px solid rgba(0, 0, 0, 0.6);
            border-left: 1px solid rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            
            box-shadow: 
                inset 0 10px 30px rgba(0, 0, 0, 0.5),
                0 15px 30px rgba(0, 0, 0, 0.2);
                
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam-canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            transform: scale(1.05); /* Slight scale to hide edges */
        }

        #webcam-canvas-container.active {
            opacity: 1;
        }

        #webcam-canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: scaleX(-1);
            border-radius: 32px;
        }

        /* Advanced Sci-Fi / iOS Scanner Overlay */
        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 32px;
            pointer-events: none;
            z-index: 5;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ffffff;
            box-shadow: 
                0 0 10px #ffffff,
                0 0 20px #4285F4,
                0 0 40px #4285F4;
            opacity: 0;
            z-index: 6;
        }

        .camera-frame.scanning .scan-line {
            opacity: 0.8;
            animation: iosScanAnim 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes iosScanAnim {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Reticle corners */
        .reticle {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(255, 255, 255, 0.8);
            border-style: solid;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 7;
        }
        
        .camera-frame.scanning .reticle { opacity: 1; }

        .reticle-tl { top: 20px; left: 20px; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
        .reticle-tr { top: 20px; right: 20px; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
        .reticle-bl { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
        .reticle-br { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

        /* Loader inside camera */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .ios-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: iosSpin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 16px;
        }

        @keyframes iosSpin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* ==========================================================================
           RESULTS & LABELS SECTION (Liquid Cards)
           ========================================================================== */
        .results-section {
            flex-grow: 1;
            padding: 0 24px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 20;
            -webkit-overflow-scrolling: touch;
        }

        .results-section::-webkit-scrollbar { width: 0px; }

        .label-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            order: 99;
        }

        .label-card.active-prediction {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            text-transform: capitalize;
        }

        .label-confidence {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 5px;
            transition: width 0.15s linear, background 0.3s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Dynamic Google Colored Progress Bars based on Confidence */
        .confidence-high .progress-fill { 
            background: linear-gradient(90deg, #34A853, #66bb6a); /* Google Green */
            box-shadow: 0 0 15px rgba(52, 168, 83, 0.6);
        }
        .confidence-high .label-confidence { color: #81c784; }

        .confidence-med .progress-fill { 
            background: linear-gradient(90deg, #FBBC05, #ffca28); /* Google Yellow */
            box-shadow: 0 0 15px rgba(251, 188, 5, 0.6);
        }
        .confidence-med .label-confidence { color: #ffd54f; }

        .confidence-low .progress-fill { 
            background: linear-gradient(90deg, #EA4335, #ef5350); /* Google Red */
            box-shadow: 0 0 15px rgba(234, 67, 53, 0.6);
        }
        .confidence-low .label-confidence { color: #e57373; }

        /* ==========================================================================
           CONTROLS (iOS Glass Buttons)
           ========================================================================== */
        .controls-section {
            padding: 20px 24px 30px;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 20;
            background: linear-gradient(to top, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
        }

        .btn-ios {
            width: 100%;
            max-width: 300px;
            padding: 18px 24px;
            border-radius: 24px;
            
            /* Glass Button Style */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-ios:active {
            transform: scale(0.95) translateY(2px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-ios:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Indicator */
        .system-status {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 30;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EA4335;
            box-shadow: 0 0 10px #EA4335;
            transition: all 0.3s ease;
        }

        .system-status.online .status-dot {
            background: #34A853;
            box-shadow: 0 0 10px #34A853;
        }

        .status-text {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
        }

        /* Animations */
        .fade-in {
            animation: fadeInAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInAnim {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hidden-hard { display: none !important; }

    </style>
</head>
<body>

    <!-- CSS Animated Google Colors Background -->
    <div class="google-gradient-bg"></div>

    <!-- Ambient Orbs for Liquid Light Reflections -->
    <div class="light-orb orb-blue"></div>
    <div class="light-orb orb-red"></div>
    <div class="light-orb orb-yellow"></div>

    <div class="app-wrapper" id="parallax-wrapper">
        <main class="liquid-glass-panel" id="main-panel">
            
            <div class="system-status" id="sys-status">
                <div class="status-dot"></div>
                <span class="status-text" id="sys-status-text">Standby</span>
            </div>

            <header class="header fade-in" style="animation-delay: 0.1s;">
                <h1>CoreVision AI</h1>
                <p>Neural Image Classification Engine</p>
            </header>

            <section class="viewport-section fade-in" style="animation-delay: 0.2s;">
                <div class="camera-frame" id="camera-frame">
                    
                    <div class="loader-overlay" id="loader-overlay">
                        <div class="ios-spinner"></div>
                        <p class="loader-text" id="loader-msg">Booting Tensor Cores...</p>
                    </div>
                    
                    <div class="scanner-overlay">
                        <div class="scan-line"></div>
                        <div class="reticle reticle-tl"></div>
                        <div class="reticle reticle-tr"></div>
                        <div class="reticle reticle-bl"></div>
                        <div class="reticle reticle-br"></div>
                    </div>

                    <div id="webcam-canvas-container"></div>
                </div>
            </section>

            <section class="results-section fade-in" id="results-container" style="animation-delay: 0.3s;">
                <!-- Skeleton UI to establish layout -->
                <div class="label-card" style="opacity: 0.5;">
                    <div class="label-header">
                        <span class="label-name" style="background: rgba(255,255,255,0.2); color: transparent; border-radius: 4px;">Loading Data</span>
                        <span class="label-confidence" style="background: transparent; border: none; color: transparent;">0.0%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width: 0%;"></div></div>
                </div>
            </section>

            <section class="controls-section fade-in" style="animation-delay: 0.4s;">
                <button class="btn-ios" id="start-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="10 8 16 12 10 16 10 8"></polygon>
                    </svg>
                    <span>Initialize Camera</span>
                </button>
            </section>

        </main>
    </div>

    <!-- ==========================================================================
         JAVASCRIPT APPLICATION LOGIC
         ========================================================================== -->
    <script>
        /**
         * System Configuration
         */
        const CONFIG = {
            MODEL_URL: "https://teachablemachine.withgoogle.com/models/DPuAl5UGa/",
            RESOLUTION: 224, // Optimized standard size for MobileNet
            THRESHOLDS: {
                HIGH: 0.85,
                MED: 0.40
            },
            MAX_FPS: 60
        };

        /**
         * Global Application State
         */
        const STATE = {
            model: null,
            webcam: null,
            maxClasses: 0,
            classLabels: [],
            isRunning: false,
            rafId: null,
            lastFrameTime: 0,
            uiElements: {}
        };

        /**
         * DOM Node References
         */
        const DOM = {
            startBtn: document.getElementById('start-btn'),
            loaderOverlay: document.getElementById('loader-overlay'),
            loaderMsg: document.getElementById('loader-msg'),
            webcamContainer: document.getElementById('webcam-canvas-container'),
            resultsContainer: document.getElementById('results-container'),
            sysStatus: document.getElementById('sys-status'),
            sysStatusText: document.getElementById('sys-status-text'),
            cameraFrame: document.getElementById('camera-frame'),
            parallaxWrapper: document.getElementById('parallax-wrapper'),
            mainPanel: document.getElementById('main-panel')
        };

        /**
         * Core Initialization Sequence
         */
        async function bootSequence() {
            if (STATE.isRunning) return;
            
            try {
                updateUIState(true, "Downloading Neural Weights...");
                
                // 1. Model Loading Phase
                const modelURL = CONFIG.MODEL_URL + "model.json";
                const metadataURL = CONFIG.MODEL_URL + "metadata.json";
                
                STATE.model = await tmImage.load(modelURL, metadataURL);
                STATE.maxClasses = STATE.model.getTotalClasses();
                STATE.classLabels = STATE.model.getClassLabels();
                
                updateUIState(true, "Requesting Hardware Access...");
                
                // 2. Hardware Initialization Phase
                STATE.webcam = new tmImage.Webcam(CONFIG.RESOLUTION, CONFIG.RESOLUTION, true);
                await STATE.webcam.setup({ facingMode: "user" }); 
                
                updateUIState(true, "Synchronizing Streams...");
                await STATE.webcam.play();
                
                // 3. DOM Mounting Phase
                DOM.webcamContainer.innerHTML = ''; // Clear any existing
                DOM.webcamContainer.appendChild(STATE.webcam.canvas);
                
                // 4. UI Generation Phase
                constructLiquidCards(STATE.classLabels);
                
                // 5. Final Activation
                STATE.isRunning = true;
                updateUIState(false);
                setSystemOnline(true);
                DOM.cameraFrame.classList.add('scanning');
                
                // 6. Enter Execution Loop
                STATE.rafId = window.requestAnimationFrame(tensorExecutionLoop);

            } catch (error) {
                console.error("Boot Sequence Failure:", error);
                updateUIState(false);
                setSystemOnline(false);
                alert("Hardware access denied or network failure. Please grant camera permissions and ensure a stable connection.");
                
                DOM.startBtn.disabled = false;
                DOM.startBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.43-5.35l-5.32 5.35"></path>
                    </svg>
                    <span>Reboot System</span>
                `;
            }
        }

        /**
         * Continuous Execution Loop (Awaited to prevent main thread blocking)
         */
        async function tensorExecutionLoop(timestamp) {
            if (!STATE.isRunning) return;

            // Frame rate limiter (optional safety feature)
            const elapsed = timestamp - STATE.lastFrameTime;
            const fpsInterval = 1000 / CONFIG.MAX_FPS;

            if (elapsed > fpsInterval) {
                STATE.lastFrameTime = timestamp - (elapsed % fpsInterval);
                
                STATE.webcam.update(); 
                await processInference(); 
            }
            
            STATE.rafId = window.requestAnimationFrame(tensorExecutionLoop);
        }

        /**
         * Frame Inference and DOM Mapping
         */
        async function processInference() {
            if (!STATE.model || !STATE.webcam) return;

            const predictions = await STATE.model.predict(STATE.webcam.canvas);
            
            for (let i = 0; i < STATE.maxClasses; i++) {
                const pred = predictions[i];
                const cleanID = sanitizeID(pred.className);
                const probability = pred.probability;
                const percentageStr = (probability * 100).toFixed(1);
                
                const ui = STATE.uiElements[cleanID];
                if (!ui) continue;

                // Update Values
                ui.text.innerText = `${percentageStr}%`;
                ui.fill.style.width = `${percentageStr}%`;

                // Wipe previous state classes
                ui.card.classList.remove('confidence-high', 'confidence-med', 'confidence-low', 'active-prediction');
                
                // Apply contextual liquid styling
                if (probability >= CONFIG.THRESHOLDS.HIGH) {
                    ui.card.classList.add('confidence-high', 'active-prediction');
                    ui.card.style.order = 1; 
                } else if (probability >= CONFIG.THRESHOLDS.MED) {
                    ui.card.classList.add('confidence-med');
                    ui.card.style.order = 2;
                } else {
                    ui.card.classList.add('confidence-low');
                    ui.card.style.order = 3;
                }
            }
        }

        /**
         * Constructs the Liquid Glass UI Cards dynamically
         */
        function constructLiquidCards(labels) {
            DOM.resultsContainer.innerHTML = ''; 
            STATE.uiElements = {}; 

            labels.forEach((label, index) => {
                const cleanID = sanitizeID(label);
                
                // Outer Card
                const card = document.createElement('div');
                card.className = 'label-card fade-in';
                card.id = `card-${cleanID}`;
                card.style.animationDelay = `${(index * 0.1) + 0.1}s`;

                // Header Area
                const header = document.createElement('div');
                header.className = 'label-header';

                const nameEl = document.createElement('span');
                nameEl.className = 'label-name';
                nameEl.innerText = label;

                const confEl = document.createElement('span');
                confEl.className = 'label-confidence';
                confEl.id = `conf-${cleanID}`;
                confEl.innerText = '0.0%';

                header.appendChild(nameEl);
                header.appendChild(confEl);

                // Progress Area
                const track = document.createElement('div');
                track.className = 'progress-track';

                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.id = `fill-${cleanID}`;

                track.appendChild(fill);

                // Assembly
                card.appendChild(header);
                card.appendChild(track);
                DOM.resultsContainer.appendChild(card);

                // Cache for O(1) loop access
                STATE.uiElements[cleanID] = {
                    card: card,
                    text: confEl,
                    fill: fill
                };
            });
        }

        /**
         * Helper: Sanitize strings for DOM IDs
         */
        function sanitizeID(str) {
            return str.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
        }

        /**
         * Helper: Manage Loading Overlay States
         */
        function updateUIState(isLoading, message = "") {
            if (isLoading) {
                DOM.startBtn.disabled = true;
                DOM.startBtn.innerHTML = `
                    <div class="ios-spinner" style="width: 24px; height: 24px; margin: 0; border-width: 2px;"></div>
                    <span>Initializing...</span>
                `;
                DOM.loaderOverlay.classList.remove('hidden');
                DOM.loaderMsg.innerText = message;
            } else {
                DOM.loaderOverlay.classList.add('hidden');
                DOM.startBtn.classList.add('hidden-hard');
                DOM.webcamContainer.classList.add('active');
            }
        }

        /**
         * Helper: System Status Indicator
         */
        function setSystemOnline(isOnline) {
            if (isOnline) {
                DOM.sysStatus.classList.add('online');
                DOM.sysStatusText.innerText = 'System Online';
            } else {
                DOM.sysStatus.classList.remove('online');
                DOM.sysStatusText.innerText = 'System Offline';
            }
        }

        /**
         * Optional: Subtle Parallax Effect for Liquid Glass
         * Tracks mouse movement on desktop to tilt the glass panel slightly
         */
        DOM.parallaxWrapper.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return; // Disable on mobile to save battery
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            DOM.mainPanel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        DOM.parallaxWrapper.addEventListener('mouseleave', () => {
            DOM.mainPanel.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Event Listener Attachment
        DOM.startBtn.addEventListener('click', bootSequence);

    </script>
</body>
</html>
